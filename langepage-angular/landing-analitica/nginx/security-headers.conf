# Security headers included by every location of default.conf (add_header is not inherited once a location sets one).
# CSP: scripts, data calls, fonts and images only from this origin (plus data: images/fonts); inline styles are allowed
# because Angular injects component styles and Chart.js sets style attributes. Inline scripts are NOT allowed: the
# production build keeps critical CSS inlining off (angular.json, optimization.styles.inlineCritical: false), whose
# onload handler would be blocked. Excel downloads use blob: navigation, which needs no CSP directive.
# Permissions-Policy: the panel uses no device APIs; deny them all.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
