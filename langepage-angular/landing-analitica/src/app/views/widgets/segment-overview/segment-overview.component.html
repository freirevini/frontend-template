<c-row>
  @for (card of cards; track card) {
    <c-col sm="6" xl="3">
      <c-widget-stat-d
        class="mb-4 segment-overview-card"
        [values]="card.values"
        [style]="{ '--segment-color': 'var(' + card.colorVar + ')' }"
        >
        <div class="segment-overview-top">
          <div class="segment-overview-head">
            <svg cIcon [name]="card.segment.icon" size="xl" class="segment-overview-icon" aria-hidden="true"></svg>
            <span class="segment-overview-name">{{ card.segment.label }}</span>
          </div>
          <c-chart [data]="card.chart" [options]="chartOptions" [height]="64" type="line">
            Tendência de normas de {{ card.segment.label }}
          </c-chart>
        </div>
      </c-widget-stat-d>
    </c-col>
  }
</c-row>
@if (loadError) {
  <p class="small text-medium-emphasis mb-4" role="alert"><app-api-error-text [error]="loadProblem" fallback="Não foi possível carregar os segmentos."></app-api-error-text></p>
}
