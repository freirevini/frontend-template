# Web server of the panel image (non-root Nginx, port 8080). Replaces /etc/nginx/conf.d/default.conf.
# The app uses clean URLs (no hash routing): every path without a file falls back to index.html.
# /api/* is NOT handled here: the cluster Ingress routes it to the BFF Service before it reaches this container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Default for everything without a content hash in its name: revalidate on every load (ETag / Last-Modified).
    # add_header is not inherited by a location that sets its own, so each such location includes the snippet again.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;

    # A new version or a new ConfigMap must be picked up on the next load.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Runtime configuration, mounted per environment from a ConfigMap (same image across environments).
    location = /assets/env.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Bundles and fonts with a content hash in the name (main-ABCD1234.js, media/font-ABCD1234.woff2) never change.
    location ~ "^/(?:media/)?[^/]+-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static files that do not exist are a real 404, never the app shell.
    location /assets/ {
        try_files $uri =404;
    }

    # Reaching this container means the Ingress did not route the call to the BFF: fail clearly instead of
    # answering the API client with index.html.
    location /api/ {
        return 404;
    }

    # SPA fallback: /dashboard, /base/accordion#section (fragment never reaches the server), F5 on any page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
