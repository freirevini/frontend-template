<!--sidebar-->
<c-sidebar
  class="d-print-none sidebar sidebar-fixed"
  id="sidebar"
  visible
>
  <c-sidebar-brand>
    <a routerLink="/" class="brand-lockup" aria-label="Agenda Normativa, ir para o início">
      <img class="brand-mark" src="assets/img/brand/brand-mark-white.svg" width="32" height="28" alt="" aria-hidden="true" />
      <span class="brand-name">Agenda <strong>Normativa</strong></span>
    </a>
  </c-sidebar-brand>
    <perfect-scrollbar [config]="perfectScrollbarConfig">
  <!--  [perfectScrollbar]="perfectScrollbarConfig"-->
  <!--
    dropdownMode "none": CoreUI 4 compares the group url with the address split by "/", so "/triagent#tabela-analitica"
    does not match "/triagent" and the group would close on every section link. Groups open and close only on click.
  -->
  <c-sidebar-nav
    [navItems]="navItems"
    dropdownMode="none"
  >
  </c-sidebar-nav>
    </perfect-scrollbar>
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100 bg-light dark:bg-transparent">
  <!--app-header-->
  <app-default-header class="mb-4 d-print-none header header-sticky" position="sticky" sidebarId="sidebar"></app-default-header>
  <!--app-body-->
  <div class="body flex-grow-1 px-3">
    <c-container breakpoint="lg" class="h-auto">
      <router-outlet></router-outlet>
    </c-container>
  </div>
  <!--app footer-->
  <app-default-footer></app-default-footer>
</div>

<!--assistant chat (floating)-->
<app-chat-widget class="d-print-none"></app-chat-widget>
